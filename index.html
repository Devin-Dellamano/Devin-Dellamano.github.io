<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Devin Dellamano, software engineer and game developer. Explore flight simulation experience, enterprise software, Unity projects, and independent games."
    />
    <meta name="theme-color" content="#2563eb" />
    <title>Devin Dellamano | Software Engineer & Game Developer</title>
    <script>
      try {
        const t = localStorage.getItem('portfolio-theme')
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
          ? 'dark'
          : 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
